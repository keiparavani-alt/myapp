<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    label { display:block; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 14px; cursor:pointer; }
    #msg { margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Create account</h1>

  <form id="registerForm">
    <label>
      Name1
      <input name="name" required maxlength="100" />
    </label>

    <label>
      Email1
      <input name="email" type="email" required maxlength="255" />
    </label>

    <label>
      Password1
      <input name="password" type="password" required minlength="6" maxlength="128" />
    </label>

    <button type="submit">Register</button>
  </form>

  <div id="msg"></div>

  <script src="app.js"></script>
</body>
</html>
