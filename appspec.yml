version: 0.0
os: linux

files:
  - source: public
    destination: /opt/myapp/public
  - source: server.js
    destination: /opt/myapp
  - source: package.json
    destination: /opt/myapp
  # if you have package-lock.json, add it too:
  # - source: package-lock.json
  #   destination: /opt/myapp

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
